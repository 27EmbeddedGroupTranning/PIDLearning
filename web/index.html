<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PID 云台实验室</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="toolbar" aria-label="实验设置">
    <label class="angle-control"><span>Yaw 目标 <output id="yawValue">0°</output></span><input id="yaw" aria-label="Yaw 目标角度" type="range" value="0" min="-150" max="150" step="1"><span class="range-limits"><span>−150°</span><span>150°</span></span></label>
    <label class="angle-control"><span>Pitch 目标 <output id="pitchValue">0°</output></span><input id="pitch" aria-label="Pitch 目标角度" type="range" value="0" min="-60" max="60" step="1"><span class="range-limits"><span>−60°</span><span>60°</span></span></label>
    <label>外力矩 / N·m<input id="load" aria-label="外力矩" type="number" value="0" min="-0.3" max="0.3" step="0.02"></label>
    <button id="zero">目标归零</button>
    <button id="run">重新编译 C++</button>
  </section>
  <div id="status" role="status">正在准备仿真…</div>
  <section class="layout">
    <article class="panel stage"><div class="panel-title"><h2>01 / 云台姿态</h2><span>实线：实际 · 虚线：目标</span></div>
      <canvas id="gimbal" aria-label="机器人云台姿态动画，含俯视和侧视投影"></canvas>
      <div class="transport"><button id="play">暂停仿真</button><button id="reset">重置状态</button><output id="clock">0.00 s</output></div>
      <div class="readouts"><div><small>Yaw 误差</small><strong id="yawError">—</strong></div><div><small>Pitch 误差</small><strong id="pitchError">—</strong></div><div><small>Yaw 力矩</small><strong id="torque">—</strong></div></div>
    </article>
    <article class="panel plots"><div class="panel-title"><h2>02 / 闭环响应</h2><select id="axis" aria-label="曲线转轴"><option value="yaw">Yaw 转轴</option><option value="pitch">Pitch 转轴</option></select></div>
      <div class="legend"><span class="cyan">实际角度</span><span class="gold">目标角度</span><span class="muted">最近 15 秒</span></div>
      <canvas id="response" aria-label="角度随时间变化曲线"></canvas>
      <div class="legend"><span class="cyan">P</span><span class="gold">I</span><span class="purple">D</span><span>白线：限幅后力矩</span></div>
      <canvas id="terms" aria-label="PID 各项及限幅后输出曲线"></canvas>
      <div id="metrics" class="metrics"></div>
      <a href="/api/csv" download>下载最近 15 秒 CSV ↗</a>
    </article>
  </section>
</main><script src="app.js"></script>
</body></html>
